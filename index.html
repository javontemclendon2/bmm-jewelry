<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>BMM Jewelry — Luxury Boutique</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #0a1410; color: #f4f0e6; font-family: 'Inter', system-ui, sans-serif; }
    #canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #ui * { pointer-events: auto; }
    header { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 18px 28px; background: linear-gradient(to bottom, rgba(10,20,16,0.85), transparent); }
    .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 700; letter-spacing: 3px; color: #d4af37; }
    .logo span { font-weight: 500; font-size: 14px; letter-spacing: 6px; display: block; color: #c9b896; margin-top: 2px; }
    nav { display: flex; gap: 28px; }
    nav a { color: #e8e0d0; text-decoration: none; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.85; }
    nav a:hover { color: #d4af37; }
    #welcome { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(20,40,30,0.4), #0a1410 70%); text-align: center; z-index: 20; transition: opacity 0.8s ease; }
    #welcome.hidden { opacity: 0; pointer-events: none; }
    #welcome h1 { font-family: 'Playfair Display', serif; font-size: clamp(36px, 6vw, 72px); font-weight: 500; color: #d4af37; margin-bottom: 12px; }
    #welcome p { font-size: 16px; max-width: 480px; line-height: 1.6; color: #c9b896; margin-bottom: 32px; }
    .btn { background: #d4af37; color: #0a1410; border: none; padding: 14px 36px; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-weight: 500; border-radius: 2px; transition: transform 0.2s, background 0.2s; }
    .btn:hover { background: #e8c547; transform: translateY(-1px); }
    .btn.secondary { background: transparent; color: #d4af37; border: 1px solid #d4af37; margin-left: 12px; }
    #case-info { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(10,20,16,0.75); backdrop-filter: blur(8px); padding: 16px 28px; border: 1px solid rgba(212,175,55,0.3); border-radius: 4px; text-align: center; min-width: 220px; display: none; }
    #case-info h3 { font-family: 'Playfair Display', serif; font-size: 20px; color: #d4af37; margin-bottom: 4px; }
    #case-info p { font-size: 13px; color: #c9b896; }
    #nav-controls { position: absolute; bottom: 28px; right: 28px; display: flex; gap: 10px; display: none; }
    #nav-controls button { width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(212,175,55,0.5); background: rgba(10,20,16,0.7); color: #d4af37; font-size: 18px; cursor: pointer; }
    #shop-overlay { position: fixed; inset: 0; background: #0a1410; z-index: 30; overflow-y: auto; display: none; padding: 80px 24px 40px; }
    #shop-overlay.active { display: block; }
    .shop-header { text-align: center; margin-bottom: 40px; }
    .shop-header h2 { font-family: 'Playfair Display', serif; font-size: 36px; color: #d4af37; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; }
    .product-card { background: #12201a; border: 1px solid rgba(212,175,55,0.15); border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 0.25s, border-color 0.25s; }
    .product-card:hover { transform: translateY(-4px); border-color: #d4af37; }
    .product-card img { width: 100%; height: 260px; object-fit: contain; background: #0e1814; padding: 16px; }
    .product-card .info { padding: 14px 16px; }
    .product-card h4 { font-size: 15px; color: #f4f0e6; margin-bottom: 4px; }
    .product-card span { font-size: 13px; color: #d4af37; }
    .close-shop { position: fixed; top: 20px; right: 24px; background: none; border: none; color: #d4af37; font-size: 28px; cursor: pointer; z-index: 40; }
    @media (max-width: 600px) { header { padding: 14px 16px; } .logo { font-size: 22px; } nav { gap: 16px; } nav a { font-size: 11px; } #nav-controls { bottom: 16px; right: 16px; } }
  </style>
</head>
<body>
  <div id="canvas"></div>
  <div id="ui">
    <header>
      <div class="logo">BMM <span>JEWELRY</span></div>
      <nav>
        <a href="#" id="btn-walk">Walkthrough</a>
        <a href="#" id="btn-shop">Shop</a>
      </nav>
    </header>
    <div id="welcome">
      <h1>BMM Jewelry</h1>
      <p>Step inside the boutique. Scroll or drag to walk the aisles and view each piece in its case.</p>
      <div>
        <button class="btn" id="enter-btn">Enter the Boutique</button>
        <button class="btn secondary" id="shop-btn-welcome">Browse Collection</button>
      </div>
    </div>
    <div id="case-info">
      <h3 id="case-title">Rings Case</h3>
      <p id="case-sub">Tap a piece for details</p>
    </div>
    <div id="nav-controls">
      <button id="prev-case">‹</button>
      <button id="next-case">›</button>
    </div>
  </div>
  <div id="shop-overlay">
    <button class="close-shop" id="close-shop">×</button>
    <div class="shop-header">
      <h2>The Collection</h2>
      <p style="color:#c9b896;margin-top:8px;">Real pieces. Real craftsmanship.</p>
    </div>
    <div class="grid" id="shop-grid"></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const pieces = [
      { file: "assets/C8R_Necklace.png", name: "C8R Cuban Necklace", category: "Necklaces", case: 0 },
      { file: "assets/Rainbow_Cross.png", name: "Rainbow Cross Pendant", category: "Pendants", case: 1 },
      { file: "assets/Round_Studs_Pair.png", name: "Round Pavé Studs", category: "Earrings", case: 2 },
      { file: "assets/Square_Studs_Pair.png", name: "Square Stud Earrings", category: "Earrings", case: 2 },
      { file: "assets/Cuban_Chain.png", name: "Iced Cuban Chain", category: "Chains", case: 3 },
      { file: "assets/chain_1.png", name: "Cuban Link Detail", category: "Chains", case: 3 },
      { file: "assets/bracelets_1.png", name: "Clover Bracelet", category: "Bracelets", case: 4 },
      { file: "assets/bracelets_2.png", name: "Floral Bracelet", category: "Bracelets", case: 4 },
      { file: "assets/rings_1.png", name: "Statement Ring", category: "Rings", case: 5 },
      { file: "assets/rings_2.png", name: "Pavé Band Ring", category: "Rings", case: 5 },
      { file: "assets/rings2_1.png", name: "Heart Ring", category: "Rings", case: 5 },
      { file: "assets/rings2_2.png", name: "Cluster Ring", category: "Rings", case: 5 },
      { file: "assets/grid_1.png", name: "Stud Collection", category: "Earrings", case: 2 },
      { file: "assets/mixed_1.png", name: "Mixed Earrings", category: "Earrings", case: 2 },
      { file: "assets/mixed_2.png", name: "Pendant Mix", category: "Pendants", case: 1 },
      { file: "assets/chain_2.png", name: "Heavy Cuban Chain", category: "Chains", case: 3 },
      { file: "assets/grid_2.png", name: "Display Grid", category: "Mixed", case: 6 }
    ];
    const cases = [
      { title: "Signature Necklace", sub: "C8R Cuban Chain" },
      { title: "Statement Pendants", sub: "Crosses & Medallions" },
      { title: "Earrings Showcase", sub: "Studs & Pairs" },
      { title: "Iced Chains", sub: "Cuban Links" },
      { title: "Bracelets", sub: "Clover & Floral" },
      { title: "Rings Case", sub: "Statement & Bands" },
      { title: "Featured Pieces", sub: "Mixed Collection" }
    ];
    let scene, camera, renderer;
    let currentCase = 0;
    let isDragging = false;
    let camTarget = new THREE.Vector3();
    let camPos = new THREE.Vector3(0, 1.6, 8);
    function init() {
      const container = document.getElementById('canvas');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a1410);
      scene.fog = new THREE.Fog(0x0a1410, 12, 28);
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.copy(camPos);
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);
      const ambient = new THREE.AmbientLight(0x334433, 0.6);
      scene.add(ambient);
      const key = new THREE.DirectionalLight(0xfff4e0, 1.2);
      key.position.set(4, 8, 6);
      scene.add(key);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 60), new THREE.MeshStandardMaterial({ color: 0x0e1a14 }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);
      pieces.forEach((p, i) => {
        new THREE.TextureLoader().load(p.file, (tex) => {
          const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.2), new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide }));
          mesh.position.set((i % 3 - 1) * 3.2, 1.4, -i * 3.5);
          scene.add(mesh);
        });
      });
      for (let i = 0; i < 8; i++) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(3.6, 2.8, 0.08), new THREE.MeshStandardMaterial({ color: 0x1a2a22 }));
        box.position.set(0, 1.3, -i * 3.5);
        scene.add(box);
      }
      animate();
      setupEvents();
      populateShop();
    }
    function animate() { requestAnimationFrame(animate); camera.position.lerp(camPos, 0.08); camera.lookAt(camTarget); renderer.render(scene, camera); }
    function goToCase(index) {
      currentCase = Math.max(0, Math.min(cases.length - 1, index));
      const z = -currentCase * 3.5;
      camPos.set(0, 1.6, z + 6.5);
      camTarget.set(0, 1.3, z);
      document.getElementById('case-title').textContent = cases[currentCase].title;
      document.getElementById('case-sub').textContent = cases[currentCase].sub;
      document.getElementById('case-info').style.display = 'block';
      document.getElementById('nav-controls').style.display = 'flex';
    }
    function setupEvents() {
      document.getElementById('enter-btn').onclick = () => { document.getElementById('welcome').classList.add('hidden'); goToCase(0); };
      document.getElementById('shop-btn-welcome').onclick = openShop;
      document.getElementById('btn-shop').onclick = (e) => { e.preventDefault(); openShop(); };
      document.getElementById('btn-walk').onclick = (e) => { e.preventDefault(); closeShop(); goToCase(0); };
      document.getElementById('close-shop').onclick = closeShop;
      document.getElementById('prev-case').onclick = () => goToCase(currentCase - 1);
      document.getElementById('next-case').onclick = () => goToCase(currentCase + 1);
      window.addEventListener('wheel', (e) => { if (document.getElementById('shop-overlay').classList.contains('active')) return; goToCase(currentCase + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
      window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
    }
    function populateShop() {
      const grid = document.getElementById('shop-grid');
      pieces.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `<img src="${p.file}" alt="${p.name}" /><div class="info"><h4>${p.name}</h4><span>${p.category}</span></div>`;
        card.onclick = () => { closeShop(); goToCase(p.case); };
        grid.appendChild(card);
      });
    }
    function openShop() { document.getElementById('shop-overlay').classList.add('active'); document.getElementById('welcome').classList.add('hidden'); }
    function closeShop() { document.getElementById('shop-overlay').classList.remove('active'); }
    init();
  </script>
</body>
</html>
